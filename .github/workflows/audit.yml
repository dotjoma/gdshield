name: gdshield Security Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    # The only export preset currently defined is "Windows Desktop"
    # (export_presets.cfg) — run on windows-latest so it's exportable as-is.
    # If you add a Linux preset, this can move to ubuntu-latest.
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate gdshield CLI & Config
        run: |
          python tools/gdshield/gdshield.py --help
          python -c "import json; json.load(open('tools/gdshield/config.json'))"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      # 1. Regenerates a fresh build seed so build_seed.generated.h exists before compilation
      - name: Rotate native build seed
        run: python tools/gdshield/gdshield.py reseed

      # 2. Build native GDExtension library using the generated seed
      - name: Build native GDExtension library
        run: |
          mkdir -Force bin
          g++ -O3 -shared -Iinclude -s "-Wl,--strip-all" src/entry.cpp -o bin/libgame.dll

      # 3. Export release build (triggers gdshield post-export hook)
      #    Use bash (Git Bash) — setup-godot creates an extensionless
      #    wrapper at $GODOT that pwsh/cmd cannot execute, but bash can.
      - name: Export release build (triggers gdshield post-export hook)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/desktop
          [ -f bin/libgame.dll ] && cp bin/libgame.dll build/desktop/libgame.dll || true

          echo "--- diagnostics ---"
          echo "GODOT=$GODOT"
          which godot || true
          file "$(which godot 2>/dev/null || echo /dev/null)" || true
          echo "-------------------"

          # Build import cache (required for headless export)
          godot --headless --import || true

          # Export
          godot --headless --export-release "Windows Desktop" build/desktop/audit_build.exe

          # Copy DLL again in case export overwrote the directory
          [ -f bin/libgame.dll ] && cp bin/libgame.dll build/desktop/libgame.dll || true
          find build -type f

      - name: Self-Audit Build Output
        shell: pwsh
        run: |
          python tools/gdshield/gdshield.py audit --dir build --report audit_report.txt
          Get-Content audit_report.txt
          if (Select-String -Path audit_report.txt -Pattern "\[FAIL\]" -Quiet) {
            Write-Error "Security regression detected in audit_report.txt"
            exit 1
          }
